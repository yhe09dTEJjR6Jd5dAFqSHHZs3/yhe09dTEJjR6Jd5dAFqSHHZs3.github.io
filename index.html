nset:0;z-index:0;pointer-events:none;display:grid;place-items:center;overflow:hidden}.voice-sphere{position:relative;width:clamp(150px,24vw,270px);aspect-ratio:1;display:grid;place-items:center;transform:scale(calc(.9 + var(--energy)*.24));transition:transform .09s linear,filter .35s ease,opacity .35s ease;opacity:.72}.voice-sphere>i{position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:50%;box-shadow:0 0 50px color-mix(in srgb,var(--accent) 6%,transparent)}.voice-sphere>i:nth-child(2){inset:13%;border-color:color-mix(in srgb,var(--accent2) 22%,transparent)}.voice-sphere>i:nth-child(3){inset:27%;border-color:color-mix(in srgb,var(--accent) 28%,transparent)}.voice-core{position:relative;width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff9 0 8%,transparent 18%),linear-gradient(145deg,color-mix(in srgb,var(--accent2) 86%,white),var(--accent));box-shadow:0 18px 55px color-mix(in srgb,var(--accent) 28%,transparent),inset 0 1px 3px #fff8}.voice-core::before,.voice-core::after{content:"";position:absolute;border-radius:50%;inset:-28%;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);opacity:0}.bubble,.empty{position:relative;z-index:1}.empty{margin:auto auto 12%;max-width:530px;text-align:center;color:var(--muted);padding:25px;text-shadow:0 1px 16px var(--card)}.main[data-state="ready"] .voice-sphere,.main[data-state="joinable"] .voice-sphere{opacity:.52}.main[data-state="listening"] .voice-core{animation:voiceBreath 2.2s ease-in-out infinite}.main[data-state="listening"] .voice-core::before{opacity:.75;animation:voiceRing 2.1s ease-out infinite}.main[data-state="thinking"] .voice-core::after{opacity:.8;border-style:dashed;inset:-42%;animation:voiceSpin 2.2s linear infinite}.main[data-state="speaking"] .voice-sphere>i{animation:voiceRing 1.35s ease-out infinite}.main[data-state="speaking"] .voice-sphere>i:nth-child(2){animation-delay:.18s}.main[data-state="speaking"] .voice-sphere>i:nth-child(3){animation-delay:.36s}.main[data-state="recovering"] .voice-sphere{filter:saturate(.25);opacity:.42}.main[data-state="recovering"] .voice-core::after{opacity:.7;border-style:dashed;inset:-48%;animation:voiceSpin 4s linear infinite}.main[data-state="ending"] .voice-sphere{opacity:.28;transform:scale(.82)}.empty strong{display:block;color:var(--ink);font-size:22px;letter-spacing:-.5px;margin-bottom:7px}.bubble{max-width:min(78%,720px);border:1px solid var(--line);border-radius:18px;padding:11px 14px;background:var(--sub);box-shadow:0 4px 16px #35235b08;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}.bubble.assistant{align-self:flex-start}.bubble small{display:block;color:var(--muted);font-size:9px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}.footer{border-top:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px}.signal{display:flex;align-items:center;gap:6px}.signal i{display:block;width:65px;height:4px;background:var(--line);border-radius:999px;overflow:hidden}.signal i::after{content:"";display:block;width:var(--level,5%);height:100%;background:var(--accent);transition:width .08s linear}.end-confirm{padding:17px 19px;background:linear-gradient(145deg,var(--card),var(--sub));transition:border-color .18s ease,box-shadow .18s ease}.end-confirm[data-active="true"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 16px 42px color-mix(in srgb,var(--accent) 14%,transparent)}.end-confirm h2{margin:0 0 6px;font-size:15px}.end-confirm p{margin:0;color:var(--muted);font-size:11px}.end-confirm-actions{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}@keyframes pulse{50%{opacity:.45;transform:scale(.8)}}@keyframes wave{50%{height:21px}}@keyframes v <body>
<div class="shell">
<header>
<div class="brand"><span class="mark"><i></i><i></i><i></i></span><h1>Yuan</h1></div>
<div id="topBadge" class="badge" role="status" aria-live="polite"><span data-i18n="preparing">正在自动准备</span></div>
</header>
<section class="journey"><div class="steps"><span data-i18n="flowPrompt">输入提示词</span><span><strong data-i18n="flowStart">开始</strong></span><span data-i18n="flowMic">授予麦克风权限</span><span data-i18n="flowTalk">语音对话</span><span><strong data-i18n="flowEnd">结束</strong></span><span data-i18n="flowConfirm">确认</span><span data-i18n="flowDone">对话结束</span></div></section>
<main class="workspace">
<section class="side">
<div class="card config">
<div><div class="label"><label for="prompt" data-i18n="prompt">提示词</label></div><textarea id="prompt" data-i18n-placeholder="promptPh" placeholder="告诉 Yuan 你希望这次对话如何进行"></textarea></div>
<div><div class="label"><label for="display" data-i18n="display">界面语言</label><span class="optional" data-i18n="optional">可选</span></div><select id="display" class="display-select"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></div>
<div><div class="label"><label for="languages" data-i18n="priority">语言优先顺序</label><span class="optional" data-i18n="optional">可选</span></div><div class="lang-line"><input id="languages" type="text" inputmode="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="languagePh" placeholder="zh-CN, zh-TW, en-US"><div id="langHint" class="lang-hint" data-i18n="languageHint">按优先顺序输入任意数量的 BCP-47 语言标签；系统会依据设备能力自动校验。</div></div></div>
<div class="actions"><button id="start" class="primary" disabled data-i18n="start">开始</button><button id="end" class="danger" disabled data-i18n="end">结束</button></div>
</div>
<div class="card status-card">
<div class="status-head"><span data-i18n="readiness">准备状态</span><small id="prepLabel" role="status" aria-live="polite">—</small></div><div class="meter"><i id="prepMeter"></i></div><div id="prepDetail" class="status-detail" role="status" aria-live="polite"></div>
</div>
<div class="card status-card"><div class="status-head"><span data-i18n="processing">语义处理路径</span><small id="pathLabel">—</small></div><div id="pathDetail" class="path-detail" role="status" aria-live="polite">—</div></div>
<div class="card status-card">
<div class="status-head"><span data-i18n="mesh">协同网络</span><small id="meshLabel">—</small></div><div class="mesh-grid"><div><small data-i18n="meshState">状态</small><strong id="meshState">—</strong></div><div><small data-i18n="peers">节点</small><strong id="peerCount">0</strong></div><div><small data-i18n="learned">学习轮次</small><strong id="learnCount">0</strong></div></div>
</div>
<div id="endConfirm" class="card end-confirm" data-active="false" aria-live="polite"><h2 data-i18n="confirmTitle">结束本次对话？</h2><p data-i18n="confirmBody">确认后将关闭麦克风，并返回可联合状态。</p><div class="end-confirm-actions"><button id="cancelEnd" disabled data-i18n="continue">继续对话</button><button id="confirmEnd" class="primary" disabled data-i18n="confirmEnd">确认结束</button></div></div>
</section>
<section id="mainPanel" class="card main" data-state="preparing">
<div class="main-head"><div class="state"><span id="orb" class="orb"></span><span id="phase" role="status" aria-live="polite">—</span></div><div id="voice" class="voice"><i></i><i></i><i></i><i></i></div></div>
<div id="chat" class="chat" aria-live="polite" aria-relevant="additions text"><div class="voice-stage" aria-hidden="true"><div class="voice-sphere"><i></i><i></i><i></i><span class="voice-core"></span></div></div><div id="empty" class="empty"><strong data-i18n="readyTitle">Yuan 会持续听着，并自行判断何时回应</strong><span data-i18n="readyBody">设备内先完成听觉分段、时机判断与自学习；可用时优先使用设备端模型。</span></div></div>
<div class="footer"><span id="modelLabel">Yuan Core · device-first</span><span class="signal"><span data-i18n="mic">麦克风</span><i id="signal"></i></span></div>
</section>
</main>
</div>
<script>
