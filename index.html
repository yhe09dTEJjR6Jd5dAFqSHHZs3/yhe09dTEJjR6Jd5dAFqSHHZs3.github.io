<script id="captureCode">
class CaptureResampler {
  constructor(sourceRate,targetRate,frameLength,onFrame){
    if(!Number.isFinite(sourceRate)||sourceRate<=0||!Number.isFinite(targetRate)||targetRate<=0||!Number.isSafeInteger(frameLength)||frameLength<1||typeof onFrame!=='function')throw new Error('AUDIO_RESAMPLER_CONFIG_INVALID');

  }
  reset(){this.acc=0;this.weight=0;this.buf=new Float32Array(this.frameLength);this.pos=0;}
  flush(){
    if(this.weight>0){this.buf[this.pos++]=this.acc/this.weight;this.weight=0;this.acc=0;}
    if(this.pos)this.onFrame(this.buf.slice(0,this.pos));this.reset();
  }
  push(data){for(const x of data){if(!Number.isFinite(x))throw new Error('AUDIO_SAMPLES_INVALID');let left=1;
    while(left>1e-8){const take=Math.min(left,this.ratio-this.weight);this.acc+=x*take;this.weight+=take;left-=take;
      if(this.weight>=this.ratio-1e-8){this.buf[this.pos++]=this.acc/this.ratio;this.acc=0;this.weight=0;
        if(this.pos===this.frameLength){this.onFrame(this.buf);this.buf=new Float32Array(this.frameLength);this.pos=0;}}}
  }}
}
